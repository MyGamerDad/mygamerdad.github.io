<path d="M169 374q52 20 119 16t119-16" fill="none" stroke="#8881e1" stroke-width="4" opacity=".6"/>
</g>
<ellipse cx="345" cy="547" rx="208" ry="12" fill="#834ad8" opacity=".55" filter="url(#blur)"/>
</svg>
